name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: ubuntu / ${{ matrix.preset }} (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: debug, cc: gcc, cxx: g++ }
          - { preset: asan, cc: clang, cxx: clang++ }
          - { preset: tsan, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Allow TSan's shadow memory layout
        if: matrix.preset == 'tsan'
        # Newer kernels randomize mmap addresses with more entropy than TSan's
        # fixed shadow mapping tolerates.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  macos:
    name: macos / release (+LZ4)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Configure
        # LZ4 is optional; enabling it here keeps the compressed-block path
        # tested, while the Linux jobs cover the default build without it.
        run: cmake --preset release -DTalus_WITH_LZ4=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  fuzz:
    name: ubuntu / libFuzzer (60 s per target)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz
      - name: Fuzz
        run: |
          cd build/fuzz
          ./fuzz/talus_fuzz_seeds corpus
          for t in block_reader sstable_reader wal_reader version_edit; do
            ./fuzz/fuzz_$t -max_total_time=60 -close_fd_mask=3 corpus/$t
          done

  benchmarks:
    name: benchmarks / ${{ matrix.os }} (all engines)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install plotting dependency
        run: python3 -m pip install 'matplotlib>=3.8,<4'
      - name: Configure comparison engines
        run: cmake -S . -B build/compare -G Ninja -DCMAKE_BUILD_TYPE=Release -DTalus_BENCH_COMPARE=ON
      - name: Build benchmark tools and regression tests
        run: cmake --build build/compare --parallel 3 --target db_bench ycsb micro_bench talus_bench_timer_test talus_bench_harness_test
      - name: Harness and adapter regression tests
        run: |
          ./build/compare/bench/talus_bench_timer_test
          ./build/compare/bench/talus_bench_harness_test
      - name: All engines, distributions, workloads and load modes
        run: python3 bench/scripts/smoke.py --build build/compare --engines talus,leveldb,rocksdb --micro --out build/validation/smoke
      - name: Restricted Linux CPU affinity
        if: runner.os == 'Linux'
        run: |
          CPU=$(python3 -c 'import os; print(max(os.sched_getaffinity(0)))')
          taskset -c "$CPU" python3 bench/scripts/smoke.py --build build/compare --engines talus --require-affinity --out build/validation/restricted-cpu
      - name: Sweep and plot smoke check
        run: python3 bench/scripts/sweep.py --build build/compare --engines talus,leveldb,rocksdb --threads 1,2 --benchmarks readrandom,readwhilewriting --num 2000 --repetitions 2 --warmup-ops 10 --rate 10000 --out build/validation/sweep
      - name: All experiment scripts (smoke sizes only)
        run: python3 bench/scripts/experiments.py --build build/compare --quick --max-threads 2 --out build/validation/experiments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-validation-${{ matrix.os }}
          path: |
            build/validation/
            build/compare/Testing/Temporary/LastTest.log
